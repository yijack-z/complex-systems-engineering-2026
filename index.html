<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>张熠家 · 复杂系统工程 2026</title>
<style>
  /* ============================================================
     图片：已内嵌在本文件里（data URI），单文件即可部署。
     构图：车图满屏固定；文字卡片靠左，压在车上，卡片是半透明玻璃
     + 背景虚化 —— 这就是字与车之间那层膜，车会从字后面透出来。
     竖图在横屏下 cover 只裁上下不裁左右，锚点定在 center 60%，
     让车（画面中下部）始终完整落在可视区里。
     缺图时回落到棕色渐变，页面不会破。
     ============================================================ */
  :root {
    --ink:        #3d2314;   /* 正文：深棕 */
    --ink-strong: #2a1508;   /* 标题：近黑棕 */
    --ink-soft:   #7a5334;   /* 链接、次要：中棕 */
    --ink-faint:  #9a7551;   /* 标签、页脚：浅棕 */

    --line:  rgba(61, 35, 20, 0.16);
    /* 分区透明：左上厚（文字压在上面）→ 右下几乎全透（车头那一块） */
    --glass: linear-gradient(135deg,
      rgba(255, 252, 247, 0.52) 0%,
      rgba(255, 252, 247, 0.18) 55%,
      rgba(255, 252, 247, 0.02) 100%);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;          /* 手机上任何情况都不横向溢出 */
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.75;

    background-color: #d9d6d2;
    background-image:
      var(--photo),
      radial-gradient(ellipse at 60% 30%, #8a4f2b 0%, #4a2a17 50%, #24120a 100%);
    background-size: cover, cover;
    background-position: center 60%;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* 压一层极薄的暖色纱，让照片和棕色字处在同一个色调里 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(100deg,
      rgba(248, 241, 231, 0.24) 0%,
      rgba(248, 241, 231, 0.07) 44%,
      rgba(248, 241, 231, 0.02) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1240px;
    margin: 0 auto;
    padding: clamp(36px, 8vh, 96px) 32px 64px;
  }

  /* 文字卡片：半透明膜 */
  .card {
    width: min(600px, 100%);
    max-width: 100%;
    overflow-wrap: break-word;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 40px 40px 30px;
    box-shadow:
      0 24px 60px rgba(42, 21, 8, 0.22),
      0 1px 0 rgba(255, 255, 255, 0.6) inset;
    -webkit-backdrop-filter: blur(6px) saturate(1.06);
    backdrop-filter: blur(6px) saturate(1.06);
    /* 极淡的白色字晕：照片深色处（轮胎、树影）也能压住字 */
    text-shadow: 0 1px 1px rgba(255, 255, 255, 0.45),
                 0 0 9px rgba(255, 255, 255, 0.30);
  }

  h1 {
    font-size: 31px;
    margin: 0 0 8px;
    color: var(--ink-strong);
    letter-spacing: 0.02em;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: 28px;
  }

  h2 {
    font-size: 16px;
    color: var(--ink-strong);
    margin: 26px 0 10px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--line);
    letter-spacing: 0.06em;
  }

  ul { padding-left: 20px; margin: 0; }
  li { margin: 7px 0; }

  a {
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid rgba(122, 83, 52, 0.35);
    transition: color 0.18s ease, border-color 0.18s ease;
  }
  a:hover {
    color: var(--ink-strong);
    border-bottom-color: var(--ink-strong);
  }

  code {
    background: rgba(122, 83, 52, 0.12);
    color: var(--ink-soft);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }

  .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .tag {
    font-size: 12px;
    color: var(--ink-faint);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 13px;
    letter-spacing: 0.05em;
  }

  footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 12.5px;
    letter-spacing: 0.03em;
  }

  /* 窄屏：照片在身后，卡片几乎满宽，膜加厚保证可读 */
  @media (max-width: 720px) {
    body {
      background-attachment: scroll;
      background-position: center 55%;
    }
    body::before {
      background: linear-gradient(180deg,
        rgba(248, 241, 231, 0.30) 0%,
        rgba(248, 241, 231, 0.55) 100%);
    }
    .wrap { padding: 88px 14px 44px; }
    .card {
      width: 100%;
      background: rgba(255, 252, 247, 0.45);
      padding: 28px 22px 22px;
      border-radius: 16px;
    }
    h1 { font-size: 25px; }
    h2 { margin-top: 22px; }
  }
